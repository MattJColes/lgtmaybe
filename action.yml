name: lgtmaybe
description: Provider-agnostic PR reviewer. Choose the provider, model, and authentication in your GitHub Actions workflow.
author: Matt Coles
branding:
  icon: check-circle
  color: green

inputs:
  provider:
    description: "Set this in the workflow `with:` block. LLM provider: openai, anthropic, openrouter, zai, bedrock, vertex, azure, ollama, or openai-compatible (any OpenAI /v1 endpoint via api_base — DeepSeek, llama.cpp, LM Studio, vLLM)."
    required: false
    default: ""
  model:
    description: "Set this beside `provider` in the workflow `with:` block. Model name understood by the chosen provider (e.g. gpt-5.5, claude-sonnet-4-6)."
    required: false
    default: ""
  preset:
    description: "Review preset. fast (the default) covers security, correctness/intent, performance, complexity, ponytail, and deprecation in four model calls when parallelism is available, or three with one worker. full restores tests/documentation and runs one call per lens for release branches and deep audits. An explicit categories list in .lgtmaybe.yml overrides the preset."
    required: false
    default: ""
  fallback_model:
    description: "Model to retry with if the primary model fails."
    required: false
    default: ""
  triage_model:
    description: "Cheap model that runs first to skip plainly-non-substantive files and rank the rest by risk; the strong `model` then reviews only the survivors. Security-relevant files (auth/crypto/IaC/CI paths, security tokens, static-analysis hits, large hunks) always escalate past triage. Unset = no triage (every file gets the full review)."
    required: false
    default: ""
  reflect_model:
    description: "Model for the self-reflection (false-positive audit) pass. Defaults to model; point it at a stronger model to audit a weaker reviewer's findings."
    required: false
    default: ""
  language:
    description: "Human language for the reviewer's prose — finding title/body and the describe/diagram text (e.g. Japanese, Spanish, French). Structural fields (path/line/side/severity/anchor) and suggestion code stay unchanged. Leave empty for English."
    required: false
    default: ""
  api_key:
    description: "API key for key-based providers (openai/anthropic/openrouter/azure, and openai-compatible hosted endpoints like DeepSeek). Leave empty for bedrock/vertex/ollama and keyless local openai-compatible servers."
    required: false
    default: ""
  api_base:
    description: "Resource endpoint for azure (https://<resource>.openai.azure.com), the OpenAI /v1 base for openai-compatible (e.g. https://api.deepseek.com/v1), or a custom base URL for other providers."
    required: false
    default: ""
  timeout:
    description: "Enforced wall-clock timeout in seconds for each model call. Leave empty for the provider default (ollama, openai-compatible and openrouter 1800, cloud 600)."
    required: false
    default: ""
  max_review_seconds:
    description: "Soft wall-clock ceiling for the whole review, in seconds (default 3600). Once it passes, no further model calls are dispatched — in-flight calls finish and the review posts partial results with an incomplete-results notice. Set 0 to disable."
    required: false
    default: ""
  temperature:
    description: "Sampling temperature (default 0.0 for deterministic reviews)."
    required: false
    default: ""
  num_ctx:
    description: "Ollama context window (ollama only; ignored for hosted providers). Raise it so a large multi-file diff isn't truncated. Leave empty for the default (32768)."
    required: false
    default: ""
  max_input_tokens:
    description: "Token budget per model call before the diff is split into batches (any provider). Leave empty for the default (100000)."
    required: false
    default: ""
  max_concurrency:
    description: "Concurrent review calls across the whole fan-out (all batches and lenses share one pool). Leave empty for the provider-aware default: 8 for cloud providers, 1 for ollama and openai-compatible (a single-slot llama.cpp/LM Studio server wants 1; raise it explicitly for a batching vLLM server)."
    required: false
    default: ""
  resolve_fixed:
    description: "Auto-resolve a review conversation once its finding is fixed: on a re-run, when a flagged finding is no longer produced and the thread is outdated, lgtmaybe replies and resolves it. Set to false to leave conversations for manual resolution."
    required: false
    default: ""
  recursive:
    description: "Walk a file whose diff exceeds max_input_tokens hunk-by-hunk (RLM-style) instead of sending it whole and letting the model drop the tail. On by default; set to false to disable."
    required: false
    default: ""
  structured_output:
    description: "Constrain model output to the findings JSON schema via the provider's response_format (JSON mode). On by default; set to false for an openai-compatible gateway/proxy that rejects response_format (the lenient parser still handles fenced/prose output either way)."
    required: false
    default: ""
  symbol_resolution:
    description: "During reflection, use ast-grep to resolve a deferred finding's referenced symbol to the file that defines it — searched in a read-only shallow clone of the PR's base branch — so the auditor re-judges a cross-file finding against the real definition. On by default; set to false to disable."
    required: false
    default: ""
  prompt_cache:
    description: "Shape every per-lens call as a shared cacheable prefix, and mark an explicit cache breakpoint on the routes that take one (anthropic, bedrock Claude/Nova, vertex Claude+Gemini, zai GLM, openrouter claude/gemini/glm/minimax) — cached reads are billed at a steep discount. Feature-detected per model and a safe no-op elsewhere. On by default; set to false to disable."
    required: false
    default: ""
  incremental:
    description: "Commit-scoped incremental review: on a synchronize push, review only the diff of the commits added since the last completed review instead of the whole PR. Auto by default (on for synchronize, full review everywhere else); set to true/false to force. Falls back to a full review after a force-push/rebase or when no previous review exists. `/review full` forces a full re-review on demand."
    required: false
    default: ""
  static_analysis:
    description: "Run installed deterministic linters (ruff, bandit, semgrep with local rules) over the changed files in a sandboxed, network-less subprocess and feed their findings to the model as untrusted hints to confirm or discard. Off by default; tools not present in the image are skipped silently."
    required: false
    default: ""
  auto_describe:
    description: "On a freshly opened (or reopened) PR, post a structured description comment — title, change type, summary, per-file walkthrough, and an intent check — before the review runs, updated in place by later /describe runs. Off by default."
    required: false
    default: ""
  auto_diagram:
    description: "On a freshly opened (or reopened) PR, post a C4-style change diagram comment — a Mermaid C4 diagram of the components the PR touches (rendered natively by GitHub), with an ASCII fallback — before the review runs, updated in place by later /diagram runs. On by default; set to false to opt out."
    required: false
    default: ""
  answer_replies:
    description: "Answer a PR author who replies inside a review conversation lgtmaybe opened on a finding: the reply is answered in that same thread, using the finding and its surrounding diff hunk as context (the reply text is treated as untrusted input). Needs the pull_request_review_comment trigger. On by default; set to false to leave finding threads unanswered."
    required: false
    default: ""
  pr_labels:
    description: "Attach labels derived from the review (no extra model calls): a review-effort/1-5 size estimate, possible-security-issue when a high/critical security finding posts, and consider-splitting when the diff spans many unrelated directories. Best-effort; off by default."
    required: false
    default: ""
  learn_feedback:
    description: "On a re-run, suppress a finding a human reacted 👎 (thumbs-down) to on its inline comment last time. The reactions live on GitHub and are re-read each run — no new persistence. Resolving a thread is NOT a suppress signal (that means fixed). On by default; set to false to disable."
    required: false
    default: ""
  fail_on:
    description: "Merge-gate threshold (info/low/medium/high/critical). When set, after posting the review a GitHub Check Run named 'lgtmaybe' is created with conclusion failure if any finding is at or above this severity, else success — make it a required check in branch protection to block merges. Enforcement rides the Check Run, never PR approval state. Off by default (no check run)."
    required: false
    default: ""
  profile:
    description: "Print a timing profile at the end of the run in the Action log: total wall time, per-stage and per-call tables (with token and prompt-cache usage), and cache hit totals. Off by default."
    required: false
    default: ""
  aws_role_arn:
    description: "IAM role ARN to assume via GitHub OIDC for bedrock. No static AWS key is ever stored."
    required: false
    default: ""
  aws_region:
    description: "AWS region for bedrock (used with aws_role_arn)."
    required: false
    default: "us-east-1"
  gcp_wif_provider:
    description: "GCP Workload Identity Federation provider resource name for vertex."
    required: false
    default: ""
  gcp_service_account:
    description: "GCP service account email to impersonate via WIF (used with gcp_wif_provider)."
    required: false
    default: ""
  azure_client_id:
    description: "Entra (Azure AD) client ID with a federated credential trusting this repo — keyless azure via GitHub OIDC. No static key is stored."
    required: false
    default: ""
  azure_tenant_id:
    description: "Entra (Azure AD) tenant ID for keyless azure (used with azure_client_id)."
    required: false
    default: ""
  config_path:
    description: "Path to the .lgtmaybe.yml config file, relative to the repo root."
    required: false
    default: ".lgtmaybe.yml"
  image:
    description: "Override the container image (advanced; defaults to the released GHCR image)."
    required: false
    default: "ghcr.io/mattjcoles/lgtmaybe:v1"
  github_token:
    description: "Token used to fetch the diff and post the review. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}
  github_identity:
    description: "GitHub author for review comments: actions posts as github-actions[bot] (default); lgtmaybe posts as lgtmaybe[bot] after you install the public lgtmaybe App and grant id-token: write."
    required: false
    default: "actions"
  identity_broker_url:
    description: "Advanced: lgtmaybe identity broker endpoint. Most users should keep the default."
    required: false
    default: "https://m8h7wpmdyi.execute-api.ap-southeast-2.amazonaws.com/token"
  app_id:
    description: "Advanced: ID of your own GitHub App used with app_private_key. Do not combine this with github_identity: lgtmaybe."
    required: false
    default: ""
  app_private_key:
    description: "Advanced: private key (PEM) of the existing GitHub App named by app_id. Most users should leave this empty."
    required: false
    default: ""
  app_owner:
    description: "Owner for a cross-repo App token (defaults to the current repository's owner). Set with app_repositories to review PRs across a monorepo or org."
    required: false
    default: ""
  app_repositories:
    description: "Newline- or comma-separated list of repositories the minted App token may access (defaults to just the current repository). Used with app_owner for cross-repo reach."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate GitHub identity configuration
      id: validate-identity
      shell: bash
      env:
        GITHUB_IDENTITY: ${{ inputs.github_identity }}
        APP_ID: ${{ inputs.app_id }}
        APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: python3 "${{ github.action_path }}/scripts/github-app-identity.py" validate

    - name: Exchange workflow identity for lgtmaybe App token
      id: lgtmaybe-token
      if: ${{ inputs.github_identity == 'lgtmaybe' }}
      shell: bash
      env:
        IDENTITY_BROKER_URL: ${{ inputs.identity_broker_url }}
      run: python3 "${{ github.action_path }}/scripts/github-app-identity.py" exchange

    - name: Configure AWS credentials (OIDC, keyless)
      if: ${{ inputs.aws_role_arn != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Authenticate to Google Cloud (WIF, keyless)
      if: ${{ inputs.gcp_wif_provider != '' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: Federate to Azure (OIDC, keyless)
      if: ${{ inputs.azure_client_id != '' }}
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ inputs.azure_client_id }}
        AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
      run: |
        set -euo pipefail
        # Exchange the workflow's GitHub OIDC token (needs `id-token: write`) for a
        # file that azure-identity's WorkloadIdentityCredential reads inside the
        # container. No client secret or static key is ever stored.
        token_file="${RUNNER_TEMP}/lgtmaybe-azure-oidc-token"
        resp=$(curl -fsSL \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")
        python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])" \
          <<<"$resp" > "$token_file"
        {
          echo "AZURE_FEDERATED_TOKEN_FILE=${token_file}"
          echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID}"
          echo "AZURE_TENANT_ID=${AZURE_TENANT_ID}"
        } >> "$GITHUB_ENV"

    - name: Mint a GitHub App token (branded bot identity)
      id: app-token
      if: ${{ inputs.app_id != '' && inputs.github_identity != 'lgtmaybe' }}
      uses: actions/create-github-app-token@v3
      with:
        # Empty owner/repositories scope the token to the current repository;
        # set them to review PRs across a monorepo/org. The token is short-lived
        # and auto-revoked in this action's post step at the end of the job.
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.app_owner }}
        repositories: ${{ inputs.app_repositories }}

    - name: Run lgtmaybe
      shell: bash
      env:
        # Prefer the selected branded App identity; a skipped mint/exchange
        # yields an empty output, so the default remains github-actions[bot].
        GITHUB_TOKEN: ${{ steps.lgtmaybe-token.outputs.token || steps.app-token.outputs.token || inputs.github_token }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_FALLBACK_MODEL: ${{ inputs.fallback_model }}
        INPUT_REFLECT_MODEL: ${{ inputs.reflect_model }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_TRIAGE_MODEL: ${{ inputs.triage_model }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_API_BASE: ${{ inputs.api_base }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MAX_REVIEW_SECONDS: ${{ inputs.max_review_seconds }}
        INPUT_TEMPERATURE: ${{ inputs.temperature }}
        INPUT_NUM_CTX: ${{ inputs.num_ctx }}
        INPUT_MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
        INPUT_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
        INPUT_RESOLVE_FIXED: ${{ inputs.resolve_fixed }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_STRUCTURED_OUTPUT: ${{ inputs.structured_output }}
        INPUT_SYMBOL_RESOLUTION: ${{ inputs.symbol_resolution }}
        INPUT_PROMPT_CACHE: ${{ inputs.prompt_cache }}
        INPUT_INCREMENTAL: ${{ inputs.incremental }}
        INPUT_STATIC_ANALYSIS: ${{ inputs.static_analysis }}
        INPUT_AUTO_DESCRIBE: ${{ inputs.auto_describe }}
        INPUT_AUTO_DIAGRAM: ${{ inputs.auto_diagram }}
        INPUT_ANSWER_REPLIES: ${{ inputs.answer_replies }}
        INPUT_PR_LABELS: ${{ inputs.pr_labels }}
        INPUT_LEARN_FEEDBACK: ${{ inputs.learn_feedback }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        LGTMAYBE_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # host-gateway mapping: lets api_base reach a model server on the
        # runner host (ollama / openai-compatible) at host.docker.internal,
        # which Linux Docker does not resolve without it.
        docker run --rm \
          --add-host=host.docker.internal:host-gateway \
          -e GITHUB_TOKEN \
          -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH \
          -e INPUT_PROVIDER -e INPUT_MODEL -e INPUT_PRESET \
          -e INPUT_FALLBACK_MODEL -e INPUT_REFLECT_MODEL \
          -e INPUT_LANGUAGE \
          -e INPUT_TRIAGE_MODEL \
          -e INPUT_API_KEY -e INPUT_API_BASE -e INPUT_CONFIG_PATH \
          -e INPUT_TIMEOUT -e INPUT_MAX_REVIEW_SECONDS -e INPUT_TEMPERATURE \
          -e INPUT_NUM_CTX -e INPUT_MAX_INPUT_TOKENS -e INPUT_MAX_CONCURRENCY \
          -e INPUT_RESOLVE_FIXED \
          -e INPUT_RECURSIVE -e INPUT_STRUCTURED_OUTPUT -e INPUT_SYMBOL_RESOLUTION \
          -e INPUT_PROMPT_CACHE -e INPUT_INCREMENTAL -e INPUT_STATIC_ANALYSIS \
          -e INPUT_AUTO_DESCRIBE -e INPUT_AUTO_DIAGRAM -e INPUT_ANSWER_REPLIES \
          -e INPUT_PR_LABELS -e INPUT_LEARN_FEEDBACK -e INPUT_FAIL_ON -e INPUT_PROFILE \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e GOOGLE_APPLICATION_CREDENTIALS -e GOOGLE_GHA_CREDS_PATH \
          -e CLOUDSDK_CORE_PROJECT -e GOOGLE_CLOUD_PROJECT \
          -e AZURE_FEDERATED_TOKEN_FILE -e AZURE_CLIENT_ID -e AZURE_TENANT_ID \
          -e AZURE_AUTHORITY_HOST \
          -v "${GITHUB_EVENT_PATH}:${GITHUB_EVENT_PATH}:ro" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -w "${GITHUB_WORKSPACE}" \
          "${LGTMAYBE_IMAGE}" action

    - name: Revoke temporary lgtmaybe App token
      id: revoke-lgtmaybe-token
      if: ${{ always() && steps.lgtmaybe-token.outputs.token != '' }}
      continue-on-error: true
      shell: bash
      env:
        LGTMAYBE_TOKEN: ${{ steps.lgtmaybe-token.outputs.token }}
      run: python3 "${{ github.action_path }}/scripts/github-app-identity.py" revoke
