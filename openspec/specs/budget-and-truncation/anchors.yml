# ast-grep anchors for budget-and-truncation - see "Living specs" in AGENTS.md.

engine.input-budget:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_fit_input_budget$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.recursive-walk:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^split_patch_into_hunks$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^split_hunk_by_budget$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^batch_files$' }
    files: [src/lgtmaybe/engine/**/*.py]

engine.timeout-split:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_review_split$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_split_batch$' }
    files: [src/lgtmaybe/engine/**/*.py]

engine.truncation-detection:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_remedy_oversized$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.reasoning-ceiling:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_reasoning_exhausted_reason$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.reasoning-step-down:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_retry_lower_effort$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^lower_reasoning_effort$' }
    files: [src/lgtmaybe/providers/**/*.py]

engine.reasoning-off:
  rule:
    kind: function_definition
    has: { field: name, regex: '^disable_reasoning$' }
  files: [src/lgtmaybe/providers/**/*.py]

engine.model-escalation:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_escalate_model$' }
  files: [src/lgtmaybe/engine/**/*.py]
