azure-devops.positions:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_partition_findings$' }
  files: [src/lgtmaybe/azure_devops/**/*.py]

azure-devops.upsert:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_upsert$' }
  files: [src/lgtmaybe/azure_devops/**/*.py]

azure-devops.dedupe:
