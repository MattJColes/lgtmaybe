# ast-grep anchors for review-pipeline — see "Living specs" in AGENTS.md.

engine.lenses-marker:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_lenses_marker$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.review:
  rule:
    kind: function_definition
    has: { field: name, regex: '^review$' }
    inside:
      kind: class_definition
      has: { field: name, regex: '^LLMReviewEngine$' }
      stopBy: end
  files: [src/lgtmaybe/engine/**/*.py]

engine.fan-out:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_fan_out$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.rescue:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_rescue$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.repair:
  rule:
    kind: function_definition
    has: { field: name, regex: '^repair_findings$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.schemaless-retry:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_retry_without_schema$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.dedupe:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_dedupe$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.snap:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_snap_findings$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^changed_line_index$' }
    files: [src/lgtmaybe/core/**/*.py]

engine.path-filters:
  rule:
    kind: function_definition
    has: { field: name, regex: '^passes_path_filters$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.size-cap:
  rule:
    kind: function_definition
    has: { field: name, regex: '^passes_size_cap$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.mid-review-retrieval:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_review_with_context$' }
  files: [src/lgtmaybe/engine/**/*.py]

engine.context-expansion:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^expand_hunks$' }
    files: [src/lgtmaybe/engine/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^trailing_context_lines$' }
    files: [src/lgtmaybe/engine/**/*.py]

engine.profile-findings:
  rule:
    kind: function_definition
    has: { field: name, regex: '^render$' }
    inside:
      kind: class_definition
      has: { field: name, regex: '^Profiler$' }
      stopBy: end
  files: [src/lgtmaybe/engine/profiling.py]
