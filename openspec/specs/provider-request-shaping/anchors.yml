# ast-grep anchors for provider-request-shaping - see "Living specs" in AGENTS.md.

provider.param-drop:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_drop_rejected_param$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.schema-ladder:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_demote_schema$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.schema-route:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_honour_route_schema_support$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.thinking-sampling:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_withhold_temperature_under_thinking$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.temperature-reach:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_litellm_drops_temperature$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.schema-subset:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_bedrock_wire_response_format$' }
  files: [src/lgtmaybe/providers/**/*.py]

provider.param-support:
  rule:
    kind: function_definition
    has: { field: name, regex: '^dropped_params$' }
  files: [src/lgtmaybe/providers/**/*.py]
