# ast-grep anchors for cli-and-local — see "Living specs" in AGENTS.md.

cli.review-command:
  rule:
    kind: function_definition
    has: { field: name, regex: '^review$' }
  files: [src/lgtmaybe/cli/**/*.py]

cli.progressive-help:
  rule:
    kind: class_definition
    has: { field: name, regex: '^ProgressiveHelpCommand$' }
  files: [src/lgtmaybe/cli/**/*.py]

cli.run-review:
  rule:
    kind: function_definition
    has: { field: name, regex: '^run_review$' }
  files: [src/lgtmaybe/review.py]

cli.graceful-interrupt:
  rule:
    kind: function_definition
    has: { field: name, regex: '^graceful_interrupt$' }
  files: [src/lgtmaybe/cli/**/*.py]

cli.profile-output:
  rule:
    kind: function_definition
    has: { field: name, regex: '^_write_profile_json$' }
  files: [src/lgtmaybe/cli/**/*.py]

cli.sarif-output:
  rule:
    kind: function_definition
    has: { field: name, regex: '^render_sarif$' }
  files: [src/lgtmaybe/cli/**/*.py]

cli.local-context:
  rule:
    kind: function_definition
    has: { field: name, regex: '^local_pr_context$' }
  files: [src/lgtmaybe/local/**/*.py]

cli.mcp-server:
  rule:
    kind: function_definition
    has: { field: name, regex: '^build_server$' }
  files: [src/lgtmaybe/cli/mcp_server.py]

cli.config:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^load_config$' }
    files: [src/lgtmaybe/config/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^set_key$' }
    files: [src/lgtmaybe/config/**/*.py]

cli.config-init:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^config_init$' }
    files: [src/lgtmaybe/cli/**/*.py]
  - rule:
      kind: function_definition
      has: { field: name, regex: '^detect$' }
    files: [src/lgtmaybe/config/detect.py]

cli.github-identity:
  rule:
    kind: function_definition
    has: { field: name, regex: '^validate$' }
  files: [scripts/github-app-identity.py]

cli.github-identity-provider:
  rule:
    kind: function_definition
    has: { field: name, regex: '^exchange$' }
  files: [scripts/github-app-identity.py]

cli.utf8-boundaries:
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_utf8_stdio$' }
    files: [src/lgtmaybe/cli/**/*.py]
  # The local git adapter's own text boundary: UTF-8 decoding plus unescaped
  # (non-C-quoted) path names on every `git` invocation.
  - rule:
      kind: function_definition
      has: { field: name, regex: '^_git$' }
    files: [src/lgtmaybe/local/__init__.py]

distribution.action-major:
  rule:
    kind: block_mapping_pair
    has: { field: key, regex: '^image$' }
  language: yaml
  files: [action.yml]

cli.local-fail-on:
  rule:
    kind: function_definition
    has: { field: name, regex: '^execute_local_review$' }
  files: [src/lgtmaybe/cli/**/*.py]
