site_name: lgtmaybe
site_description: AI code review for GitHub, GitLab, Gitea, Azure DevOps, and local Git diffs. Choose a hosted or local model; Bedrock, Vertex, and Azure support keyless cloud auth.
site_url: https://lgtmaybe.coles.codes/
repo_url: https://github.com/MattJColes/lgtmaybe
repo_name: MattJColes/lgtmaybe
edit_uri: edit/main/docs/

docs_dir: docs
# The generator scripts live in docs/ as the source for their generated files;
# keep them out of the built site.
exclude_docs: |
  generate_reference.py
  generate_llms_txt.py
  whats_new.py

# Builds the homepage's What's New list and the Changelog page from
# CHANGELOG.md at build time, so a release never leaves them stale.
hooks:
  - docs/whats_new.py

theme:
  name: material
  custom_dir: overrides
  # Light-stroke variant: the header bar is slate, the same colour as the
  # primary logo's strokes, which made the brace arms invisible there.
  logo: assets/logo-light.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    # Hover tooltips for the acronyms in includes/abbreviations.md.
    - content.tooltips

extra_css:
  - stylesheets/extra.css

# Cookieless, privacy-first analytics. The config (endpoint + no_onload) must load
# before GoatCounter's script, which is why goatcounter.js is listed first.
extra_javascript:
  - javascripts/goatcounter.js
  - https://gc.zgo.at/count.js

# A link to a heading that a rewrite renamed fails the strict build.
validation:
  anchors: warn

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      # Outside docs_dir, so it is never built or read as a page itself.
      auto_append:
        - includes/abbreviations.md
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorial:
      - Getting started: tutorial/getting-started.md
  - How-to:
      - Install & run:
          - Install the CLI: how-to/install-the-cli.md
          - Choose a review model: how-to/choose-a-review-model.md
          - Use as a GitHub Action: how-to/use-as-github-action.md
          - Post as lgtmaybe[bot]: how-to/post-as-a-github-app.md
          - Review on Azure DevOps: how-to/review-on-azure-devops.md
          - Review on Gitea: how-to/review-on-gitea.md
          - Review on GitLab: how-to/review-on-gitlab.md
      - Cloud providers (API key):
          - Review with OpenAI: how-to/review-with-openai.md
          - Review with Claude (Anthropic): how-to/review-with-anthropic.md
          - Review with OpenRouter: how-to/review-with-openrouter.md
          - Review with z.ai (GLM): how-to/review-with-zai.md
      - Keyless cloud (OIDC/WIF):
          - Review with Bedrock OIDC: how-to/review-with-bedrock-oidc.md
          - Review with Vertex WIF: how-to/review-with-vertex-wif.md
          - Review with Azure OpenAI: how-to/review-with-azure.md
      - Local & self-hosted:
          - Run locally with ollama: how-to/run-locally-with-ollama.md
          - Other OpenAI-compatible servers: how-to/use-a-custom-openai-compatible-endpoint.md
      - Configure & extend:
          - Configure .lgtmaybe.yml: how-to/configure-lgtmaybe-yml.md
          - Add a custom review lens: how-to/add-a-custom-lens.md
          - Scope instructions to a directory: how-to/scope-review-instructions-to-a-directory.md
          - Calibrate reviews to your project: how-to/calibrate-reviews-to-your-project.md
          - Generate a change overview: how-to/generate-a-change-diagram.md
          - Fix findings with an AI agent: how-to/fix-findings-with-an-ai-agent.md
          - Review before you commit: how-to/review-before-you-commit.md
          - Upload findings as SARIF: how-to/upload-findings-as-sarif.md
          - Use from a coding agent (MCP): how-to/use-from-a-coding-agent-over-mcp.md
          - Reduce review cost: how-to/reduce-review-cost.md
      - Maintainers:
          - Releasing: how-to/releasing.md
          - Write the docs: how-to/write-docs.md
  - Reference:
      - Configuration: reference/config.md
      - Profile output: reference/profile.md
      - Glossary: reference/glossary.md
      - Changelog: changelog.md
  - Explanation:
      - What gets reviewed: explanation/what-gets-reviewed.md
      - Risk of change: explanation/risk-of-change.md
      - Architecture: explanation/architecture.md
      - Auth model: explanation/auth-model.md
      - Data and privacy: explanation/data-and-privacy.md
      - Trust and cost: explanation/trust-and-cost.md
