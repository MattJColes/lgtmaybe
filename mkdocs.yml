site_name: lgtmaybe
site_description: Provider-agnostic PR reviewer — seven hosted providers, ollama, and any OpenAI-compatible endpoint, one flag, no keys in secrets for cloud.
site_url: https://mattjcoles.github.io/lgtmaybe/
repo_url: https://github.com/MattJColes/lgtmaybe
repo_name: MattJColes/lgtmaybe
edit_uri: edit/main/docs/

docs_dir: docs
# The generator scripts live in docs/ as the source for their generated files;
# keep them out of the built site.
exclude_docs: |
  generate_reference.py
  generate_llms_txt.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorial:
      - Getting started: tutorial/getting-started.md
  - How-to:
      - Install & run:
          - Install the CLI: how-to/install-the-cli.md
          - Use as a GitHub Action: how-to/use-as-github-action.md
      - Cloud providers (API key):
          - Review with OpenAI: how-to/review-with-openai.md
          - Review with Claude (Anthropic): how-to/review-with-anthropic.md
          - Review with OpenRouter: how-to/review-with-openrouter.md
          - Review with z.ai (GLM): how-to/review-with-zai.md
      - Keyless cloud (OIDC/WIF):
          - Review with Bedrock OIDC: how-to/review-with-bedrock-oidc.md
          - Review with Vertex WIF: how-to/review-with-vertex-wif.md
          - Review with Azure OpenAI: how-to/review-with-azure.md
      - Local & self-hosted:
          - Run locally with ollama: how-to/run-locally-with-ollama.md
          - Other OpenAI-compatible servers: how-to/use-a-custom-openai-compatible-endpoint.md
      - Configure & extend:
          - Configure .lgtmaybe.yml: how-to/configure-lgtmaybe-yml.md
          - Add a custom review lens: how-to/add-a-custom-lens.md
          - Fix findings with an AI agent: how-to/fix-findings-with-an-ai-agent.md
      - Maintainers:
          - Releasing: how-to/releasing.md
  - Reference:
      - Configuration: reference/config.md
  - Explanation:
      - What gets reviewed: explanation/what-gets-reviewed.md
      - Architecture: explanation/architecture.md
      - Auth model: explanation/auth-model.md
      - Data and privacy: explanation/data-and-privacy.md
      - Trust and cost: explanation/trust-and-cost.md
