# Config for lgtmaybe reviewing its own PRs (the dogfood workflow).
#
# Skip our generated docs. They are regenerated by scripts and guarded by
# freshness tests, so a human never meaningfully reviews them — and llms-full.txt
# is the whole-docs corpus, which a recursive walk explodes into many model calls
# and blows the review's time budget for zero value.
exclude_paths:
  - docs/llms*.txt            # whole-docs corpus + index (generate_llms_txt.py)
  - docs/reference/config.md  # generated from ReviewConfig (generate_reference.py)

# Bound what one call may generate. A correctness lens once ran to this model's
# full 65,536-token output ceiling and came back cut off mid-JSON — 21 minutes
# and 65k tokens for a single lens, against ~5.5k for the other three combined.
# The truncation is legible now (it names itself, and the findings it finished
# emitting survive), but nothing bounded the cost of getting there.
#
# 16k was ~7x the largest output a healthy lens had produced here (2,261 tokens),
# and that turned out to be the wrong measure. Under a reasoning model the cap
# also pays for thinking tokens, and this model spends most of it there: on #309
# it truncated 3 of 4 lenses, and on #311 — a fifteen-line diff — it still
# truncated 1 of 4 at the same 16,384. That is the starvation this comment
# already warned about, observed: a cap sized to a plain model's findings
# payload truncates every lens rather than only a runaway.
#
# 32k restores the thinking headroom while still bounding the runaway at half
# the model's own 65,536 ceiling, so a lens that goes away still stops in half
# the time instead of 21 minutes. It also keeps the pre-flight reservation
# OpenRouter charges against max_tokens well under the full ceiling.
max_tokens: 32768

# ...and 32k did not fix it either, which is what finally identified the real
# lever. Measured on #321's review, with the reasoning-token instrumentation
# from #319 reporting on successful calls for the first time:
#
#   lens          reasoning   outcome
#   security         33,660   truncated
#   security         35,463   truncated
#   security         33,180   truncated
#   artefacts        33,775   truncated
#   artefacts        25,963   truncated
#   correctness      32,194   truncated   (1,003s)
#   correctness      33,232   truncated
#   code-health      28,909   OK — of 29,642 output tokens, i.e. 97.5%
#   artefacts         2,443   OK — of 2,939 output tokens
#
# Five of nine calls spent the ENTIRE 32,768 ceiling on thought before writing
# a finding, and the one big success wrote ~733 tokens of findings after 28,909
# tokens of thinking. Raising the cap never worked because the cap does not
# separate thinking from answering — it buys the model more room to think.
#
# The table above is real. The conclusion first drawn from it — "`low` is the
# separate lever, step up to `medium` if findings look shallow" — was not: the
# lever was never connected. litellm forwards `reasoning_effort` on openrouter
# only for models its capability map already flags reasoning-capable, and the
# model this repo points at is not in that map, so `drop_params` discarded the
# value in silence. The proof it was still being discarded after this line was
# added: #367's review, with `low` set right here, spent 34,012 reasoning tokens
# on one lens against the 32,768 ceiling above and truncated.
#
# It is connected now — the budget goes out in OpenRouter's own top-level
# `reasoning` object for models litellm won't forward it for, and a param that
# would be dropped is warned about at startup instead of vanishing. So the
# numbers below have yet to be re-measured against a budget that was actually
# enforced. Read them as the evidence that the cap is the wrong lever, not as
# evidence about what `low` does. Re-measure before moving this value.
reasoning_effort: low
