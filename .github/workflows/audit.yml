name: audit

# Dependency vulnerability (CVE) scan. This is deliberately NOT a deterministic
# per-PR gate: a CVE disclosed upstream can change the result without any code
# change, so running it on every PR would randomly break unrelated builds.
# Instead it runs on a weekly schedule, on pushes/PRs that actually touch the
# dependency set, and on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Export locked runtime dependencies
        # Audit exactly what ships to users (runtime deps, pinned by the lockfile).
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o audit-requirements.txt

      - name: Audit for known vulnerabilities
        # Ignored, revisit when litellm lifts its `filelock<4.0` cap (fixes are
        # in filelock 4.2.1, unreachable while every litellm release caps it):
        #   CVE-2026-112940, CVE-2026-112913, CVE-2026-112936, CVE-2026-112915:
        #     filelock ReadWriteLock, which nothing in our dependency tree uses.
        #   CVE-2026-112908, CVE-2026-112911, CVE-2026-112938: StrictSoftFileLock
        #     and SoftReadWriteLock, which nothing in our dependency tree uses.
        #   CVE-2026-112907, CVE-2026-112912, CVE-2026-112935, CVE-2026-112939:
        #     SoftFileLock; only huggingface-hub's no-flock fallback uses it, and
        #     each needs a local attacker on the lock's directory.
        #   CVE-2026-112909, CVE-2026-112910: Unix/WindowsFileLock behind
        #     huggingface-hub's cache and litellm's proxy CLI (which we never
        #     run); both need another local user writing to the lock's directory.
        run: >-
          uvx pip-audit --requirement audit-requirements.txt
          --ignore-vuln CVE-2026-112940
          --ignore-vuln CVE-2026-112913
          --ignore-vuln CVE-2026-112936
          --ignore-vuln CVE-2026-112915
          --ignore-vuln CVE-2026-112908
          --ignore-vuln CVE-2026-112911
          --ignore-vuln CVE-2026-112938
          --ignore-vuln CVE-2026-112907
          --ignore-vuln CVE-2026-112912
          --ignore-vuln CVE-2026-112935
          --ignore-vuln CVE-2026-112939
          --ignore-vuln CVE-2026-112909
          --ignore-vuln CVE-2026-112910
