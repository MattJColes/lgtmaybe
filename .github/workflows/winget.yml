name: winget

on:
  workflow_call:
    inputs:
      version:
        description: "Version or tag to submit, e.g. 1.0.0 or lgtmaybe-v1.0.0."
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version or tag to submit, e.g. 1.0.0 or lgtmaybe-v1.0.0."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}" -replace '^lgtmaybe-v', '' -replace '^v', ''
          if (-not $v) {
            throw "version is required"
          }
          $asset = "lgtmaybe-$v-windows-x86_64.exe"
          "version=$v" >> $env:GITHUB_OUTPUT
          "asset_url=https://github.com/MattJColes/lgtmaybe/releases/download/lgtmaybe-v$v/$asset" >> $env:GITHUB_OUTPUT

      - name: Wait for the release asset
        shell: pwsh
        run: |
          $url = "${{ steps.ver.outputs.asset_url }}"
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 30 | Out-Null
              Write-Output "Release asset is available: $url"
              exit 0
            } catch {
              if ($attempt -eq 60) {
                throw "Release asset did not become available within 10 minutes: $url"
              }
              Start-Sleep -Seconds 10
            }
          }

      - name: Check whether the winget package exists
        id: package
        shell: pwsh
        run: |
          $manifestUrl = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/m/MattJColes/lgtmaybe"
          try {
            Invoke-WebRequest -Uri $manifestUrl -Method Get -TimeoutSec 30 -Headers @{
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } | Out-Null
            "exists=true" >> $env:GITHUB_OUTPUT
          } catch {
            if ([int]$_.Exception.Response.StatusCode -eq 404) {
              "exists=false" >> $env:GITHUB_OUTPUT
              Write-Warning "MattJColes.lgtmaybe is not published in winget yet. Submit and moderate the first manifest manually; automatic updates will start with the next release."
              exit 0
            }
            throw
          }

      - name: Install wingetcreate
        if: steps.package.outputs.exists == 'true'
        shell: pwsh
        run: |
          winget install --id Microsoft.WingetCreate --exact `
            --accept-package-agreements --accept-source-agreements `
            --disable-interactivity

      - name: Submit winget update
        if: steps.package.outputs.exists == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          wingetcreate update MattJColes.lgtmaybe `
            --version "${{ steps.ver.outputs.version }}" `
            --urls "${{ steps.ver.outputs.asset_url }}" `
            --submit --token $env:WINGET_TOKEN
