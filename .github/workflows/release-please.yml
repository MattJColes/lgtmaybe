name: release-please

# Reads conventional commits on main and maintains a "Release PR" that bumps the
# version + regenerates the changelog. Merging that PR creates the tag + GitHub
# release, then this same run publishes.
#
# The PyPI publish job is INLINE here (not in the reusable release.yml) on
# purpose: PyPI Trusted Publishing does not support reusable workflows, so the
# OIDC job_workflow_ref must equal the top-level workflow_ref. The trusted
# publisher on PyPI is therefore configured with workflow `release-please.yml`.
# workflow_dispatch lets us (re)publish an existing tag manually.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to (re)publish to PyPI, e.g. lgtmaybe-v0.1.0."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps `version` in pyproject.toml, which invalidates the
      # `[[package]] name = "lgtmaybe"` entry in uv.lock — and `uv lock --check`
      # in ci.yml then fails on main after every release. Regenerate the lockfile
      # on the Release PR branch so both land in the same merge. Running the real
      # `uv lock` is the only correct fix: uv.lock holds a `version` key per
      # dependency, so a text/TOML updater aimed at it could rewrite the wrong
      # one — and silently no-ops if its path stops matching.
      - uses: actions/checkout@v7
        if: ${{ steps.rp.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ steps.rp.outputs.pr }}
        with:
          python-version: "3.12"
      - name: Sync uv.lock with the bumped version
        if: ${{ steps.rp.outputs.pr }}
        run: |
          uv lock
          git diff --quiet -- uv.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with the version bump" -- uv.lock
          git push

  # PyPI publish — inline (top-level) so OIDC trusted publishing matches the
  # `release-please.yml` publisher. Runs on a fresh release or a manual dispatch.
  pypi:
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing — no PyPI token in secrets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || needs.release-please.outputs.tag_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # GHCR image + floating major tag — fine as a reusable workflow (no OIDC
  # trusted-publishing constraint; uses GITHUB_TOKEN).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write # move floating major tag
      packages: write # GHCR push
    secrets: inherit

  # Homebrew tap — call it directly, because a `release: published` event is NOT
  # delivered for a release that release-please cuts with the built-in
  # GITHUB_TOKEN. The formula installs from PyPI wheels (no
  # `update-python-resources`, so no 24h PyPI cooldown) and publishes
  # immediately; homebrew.yml's daily schedule is only a safety net.
  # Needs `pypi`, not just release-please: the install gate pip-installs the
  # exact release version from PyPI, so racing the publisher fails the gate
  # with "No matching distribution found" whenever brew's setup finishes first.
  # A failed PyPI publish skips this job entirely — a formula whose wheels
  # aren't downloadable must not reach the tap.
  homebrew:
    needs: [release-please, pypi]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  windows-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/windows-exe.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write

  winget:
    needs: [release-please, windows-exe]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
