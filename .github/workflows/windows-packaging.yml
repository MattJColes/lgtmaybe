name: Windows packaging

on:
  pull_request:
    paths:
      - .github/workflows/windows-*.yml
      - .github/workflows/winget.yml
      - packaging/**
      - scripts/scan_windows_exe.py
      - tests/test_windows_defender.py
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked packaging environment
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: uv sync --frozen --no-dev --group packaging --no-binary-package pyinstaller --no-cache

      # Compare with the existing release, but gate this PR on its new build.
      - name: Check existing release for comparison
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $json = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not read the latest release" }
          $release = ($json -join "`n") | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -like '*-windows-x86_64.exe' } | Select-Object -First 1
          if (-not $asset) { throw "The latest release has no Windows executable yet" }
          gh release download $release.tagName --repo $env:GITHUB_REPOSITORY `
            --pattern $asset.name --dir existing-release
          if ($LASTEXITCODE -ne 0) { throw "Could not download the existing executable" }
          uv run --no-sync python scripts/scan_windows_exe.py "existing-release/$($asset.name)" `
            --asset-url $asset.url --report-dir defender-report/existing-release

      - name: Build executable
        run: uv run --no-sync pyinstaller packaging/pyinstaller/lgtmaybe.spec

      - name: Scan with Defender
        run: uv run --no-sync python scripts/scan_windows_exe.py dist/lgtmaybe.exe

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $expected = uv run --no-sync python -c "from importlib.metadata import version; print('lgtmaybe ' + version('lgtmaybe'))"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the expected version" }
          $version = & .\dist\lgtmaybe.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne $expected) {
            throw "Frozen executable reported '$version', expected '$expected'"
          }
          foreach ($arguments in @(@('--help'), @('config', 'path'), @('review', '--help'))) {
            & .\dist\lgtmaybe.exe @arguments
            if ($LASTEXITCODE -ne 0) { throw "Executable smoke test failed: $arguments" }
          }

      - name: Preserve Defender evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-defender-packaging-${{ github.run_id }}-${{ github.run_attempt }}
          path: defender-report/
          retention-days: 30
