name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Sync (with dev deps)
        run: uv sync --dev

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

  # Single, matrix-independent status for branch protection to require. The `test`
  # job above runs once per Python version, so it reports as `test (3.11)` …
  # `test (3.14)` — names that change whenever the matrix does. This gate reports a
  # stable `check` context that is green only when every `test` leg passed, so the
  # required check never dangles as "Expected" when the matrix is edited.
  check:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test legs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
