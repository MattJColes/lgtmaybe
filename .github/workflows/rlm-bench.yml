# RLM A/B benchmark — recursive hunk-walk vs the original whole-file method, on a
# real local ollama model. Two matrix legs run as SEPARATE tasks (whole /
# recursive); each reviews the RLM fixtures with one strategy `repeats` times and
# reports recall mean / min / max, so the run summary shows who wins on real
# numbers AND how noisy the result is (the model samples at temperature > 0).
#
# This is a BENCHMARK, not a gate: --min-recall 0.0 means neither leg can fail.
# It runs a live ollama model on a CPU runner (minutes per leg), so it is
# DISPATCH-ONLY — run it ad hoc from the Actions tab when you want the numbers,
# rather than on every PR that touches the RLM code. --max-input-tokens 300
# (below each fixture's ~600 tokens, above a single hunk) forces the over-budget
# file to split so the strategies diverge.
name: rlm-bench

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per strategy (raise for a wide, low-noise sweep)"
        required: false
        default: "8"
      model:
        description: "ollama model tag"
        required: false
        default: "qwen3.5:4b"
      categories:
        description: "Comma-separated review lenses"
        required: false
        default: "security,correctness,performance"
      budget:
        description: "--max-input-tokens (set below a fixture's size to force the split)"
        required: false
        default: "300"

concurrency:
  group: rlm-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # whole = the original method (file sent whole); recursive = the RLM walk.
        method: [whole, recursive]
    env:
      # The `|| ...` fallbacks keep the job runnable even if a dispatch omits an
      # input; on a normal dispatch the input defaults above supply these instead.
      LGTMAYBE_E2E_OLLAMA_MODEL: ${{ github.event.inputs.model || 'qwen3.5:4b' }}
      REPEATS: ${{ github.event.inputs.repeats || '1' }}
      CATEGORIES: ${{ github.event.inputs.categories || 'security,correctness,performance' }}
      BUDGET: ${{ github.event.inputs.budget || '300' }}
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (with dev deps)
        run: uv sync --dev

      - name: Install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache ollama model
        uses: actions/cache@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-${{ runner.os }}-${{ env.LGTMAYBE_E2E_OLLAMA_MODEL }}

      # The same script a developer runs locally (DEVELOPMENT.md) — serve,
      # readiness wait, pull — so the bring-up can't drift from local either.
      - name: Start ollama and pull the model
        run: scripts/e2e-up.sh ollama

      # One strategy per matrix leg (--only), repeated REPEATS times over both RLM
      # fixtures. The benchmark itself (evals/rlm.py) owns the repeat loop and the
      # mean/min/max — the same command a developer runs locally — so CI and local
      # runs can never drift. --max-input-tokens forces the over-budget split.
      - name: "Benchmark: ${{ matrix.method }} (x${{ env.REPEATS }})"
        run: |
          uv run python -m evals.rlm \
            --provider ollama \
            --model "$LGTMAYBE_E2E_OLLAMA_MODEL" \
            --api-base http://localhost:11434 \
            --only "${{ matrix.method }}" \
            --repeats "$REPEATS" \
            --categories "$CATEGORIES" \
            --budget "$BUDGET" \
            --num-ctx 16384 \
            --timeout 900 \
            --temperature 0.6 \
            --top-p 0.8 \
            --top-k 20 \
            --no-reflect | tee result.txt

      - name: Publish result to the run summary
        if: always()
        run: |
          {
            echo "### RLM bench — ${{ matrix.method }} (model $LGTMAYBE_E2E_OLLAMA_MODEL, lenses $CATEGORIES)"
            echo '```'
            grep -E "recall mean" result.txt || echo "(no result captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
