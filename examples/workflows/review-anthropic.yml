# Copy into your repo at .github/workflows/lgtmaybe.yml
#
# Anthropic (key-based). Add an ANTHROPIC_API_KEY repo secret.
name: lgtmaybe (anthropic)

on:
  pull_request_target:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# The event name is part of the key on purpose. lgtmaybe posts comments during a
# review (the change diagram, the inline findings), and those comments fire the
# issue_comment / pull_request_review_comment events this workflow subscribes to.
# Without the event in the key those runs share this group and cancel-in-progress
# kills the review that posted the comment. A new push still cancels an in-flight
# review — two pushes are both pull_request_target, so they still collide.
concurrency:
  group: lgtmaybe-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    # Only trusted authors (repo owner / org member / collaborator) can trigger a
    # review, so fork PRs and drive-by /ask or /review comments from strangers
    # cannot spend your provider budget. A maintainer can still opt-in to an
    # external PR by commenting /review on it. (Comments not on a PR are skipped.)
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MattJColes/lgtmaybe@v1
        with:
          provider: anthropic
          model: claude-sonnet-4-6
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
