# Copy into your repo at .github/workflows/lgtmaybe.yml
#
# OpenAI-compatible endpoint — any server speaking the OpenAI /v1 wire format
# (DeepSeek's API, a self-hosted vLLM, an OpenAI-compatible proxy). Set api_base
# to the endpoint. Add a key secret for hosted endpoints; leave api_key empty for
# keyless self-hosted servers.
name: lgtmaybe (openai-compatible)

on:
  pull_request_target:
    # `edited` catches a retarget: when the PR below a stacked PR merges, the
    # one above moves onto its base, with the same head and a new diff. Other
    # edits (title, description) are filtered out below and start no job.
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

# pull_request_target runs against the BASE repo (secrets available); the action
# only ever reads the diff via the API and never checks out PR code.
permissions:
  contents: read
  pull-requests: write

# The automatic diagram posts an issue_comment event after a review. Because
# workflow-level concurrency applies before the job guard, the event name keeps
# that run from cancelling the review job that posted it. A new push still
# cancels an in-flight review — two pushes are both
# pull_request_target, so they still collide.
# A title or description edit gets a group of its own (its run id), so the
# run it starts, which runs no job, cannot cancel a review either.
concurrency:
  group: lgtmaybe-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Only trusted authors (repo owner / org member / collaborator) can trigger a
    # review, so fork PRs and drive-by /ask or /review comments from strangers
    # cannot spend your provider budget. A maintainer can still opt-in to an
    # external PR by commenting /review on it. (Comments not on a PR are skipped.)
    # The issue_comment arm also requires a slash command in the body. That event
    # fires on EVERY comment on every PR, so without it an ordinary "lgtm,
    # merging" starts a job that claims a runner, pulls the container and boots
    # Python only to find no command and exit — no provider spend, but a runner
    # held ahead of the reviews that do have work to do. `contains` is
    # case-insensitive and substring-based, so the guard stays looser than the
    # parser (which additionally wants the command at the START of the body):
    # /REVIEW and `/review full` both pass.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base) &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, '/describe') ||
        contains(github.event.comment.body, '/diagram')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # base repo only — for .lgtmaybe.yml config
      - uses: MattJColes/lgtmaybe@v2
        with:
          provider: openai-compatible
          model: deepseek-chat
          api_base: https://api.deepseek.com/v1
          # Hosted endpoints need a key; omit api_key for keyless self-hosted servers.
          api_key: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
