[project]
name = "lgtmaybe"
version = "1.3.0"
description = "Provider-agnostic PR reviewer — seven hosted providers, ollama, and any OpenAI-compatible endpoint, one flag, no keys in secrets for cloud."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Matt Coles" }]
dependencies = [
    "ast-grep-cli>=0.44.0",
    "click>=8.4.1",
    "httpx>=0.28.1",
    # litellm 1.92.0 ships only cp311–cp313 compiled wheels; its sdist needs
    # pyo3 0.23 (max Python 3.13), so 3.14 installs fail. Cap it there until
    # upstream publishes cp314 wheels or a pyo3 with 3.14 support.
    "litellm>=1.87.1; python_version < '3.14'",
    "litellm>=1.87.1,<1.94; python_version >= '3.14'",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]

# Per-provider auth deps for the keyless cloud paths. litellm normalises the
# call but does NOT bundle the cloud SDKs needed to sign/authenticate, so each
# keyless provider needs its package here or a review dies at call time with a
# ModuleNotFoundError. The Action image bundles all three (see Dockerfile);
# local `pip install` users pull only what they need, e.g. `lgtmaybe[bedrock]`.
[project.optional-dependencies]
# Keyless Azure OpenAI (Azure AD / Entra token via GitHub OIDC or local creds).
azure = [
    "azure-identity>=1.19",
]
# Bedrock — boto3/botocore for SigV4 signing of InvokeModel calls.
bedrock = [
    "boto3>=1.34",
]
# Vertex — google-auth mints the access token from ambient ADC/WIF creds.
vertex = [
    "google-auth>=2.0",
]
# Static-analysis fusion (`static_analysis.enabled: true`): the tool binaries
# the sandboxed runner invokes. Each is optional at run time too — an
# uninstalled tool is skipped silently, so installs without this extra are
# unaffected.
static-analysis = [
    "ruff>=0.5",
    "bandit>=1.7",
    "semgrep>=1.60",
]

[project.scripts]
lgtmaybe = "lgtmaybe.cli:main"

[project.urls]
Homepage = "https://lgtmaybe.coles.codes/"
Repository = "https://github.com/MattJColes/lgtmaybe"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20260518",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgtmaybe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lgtmaybe", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Live e2e tests (tests/e2e/) drive the real CLI against a local model server, so
# they need a running ollama/llama.cpp/vLLM and a downloaded model — never the
# default gate. They are DESELECTED here and opted into with `pytest -m e2e`
# (a command-line -m overrides this one). Markers are registered so the strict
# warning filter below never trips on an unknown mark.
addopts = "-m 'not e2e'"
markers = [
    "e2e: live end-to-end test against a local model server (deselected by default; run with -m e2e)",
]
# Code-quality gate: using a deprecated API (ours, the stdlib's, or a dependency's
# triggered on our hot path) is a hard error, not silent noise. This is fully
# deterministic given the lockfile. If a *third-party* deprecation we don't
# control starts failing after a dependency bump, add a narrow ignore here
# (e.g. 'ignore::DeprecationWarning:somelib') rather than weakening the rule.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::EncodingWarning",
    "ignore::EncodingWarning:litellm",
    "ignore::EncodingWarning:regex",
    "ignore::EncodingWarning:tests",
]

[tool.mypy]
python_version = "3.11"
packages = ["lgtmaybe"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# azure-identity is an optional extra (keyless Azure); it ships no stubs.
module = ["azure.*"]
ignore_missing_imports = true
